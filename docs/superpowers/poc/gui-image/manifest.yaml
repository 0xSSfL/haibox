# Disposable Xpra validation fixture manifest.
#
# This is NOT a HAIBOX catalog image. It records the inputs and expected
# inventory for the reproducible GUI prototype. Do not add it to images/ or
# publish it until the GUI production gates in
# docs/superpowers/reviews/2026-11-10-haibox-desktop-security-review.md close.
name: gui-poc-validation
status: prototype
production: false
tag: haibox/gui-poc-validation:0.1.0
dockerfile: Dockerfile
base:
  image: fedora:44
  digest: sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
  scanner_coverage: grype-fallback
  scanner_note: >-
    Trivy 0.76.2 does not support Fedora. The hardened image scanner in
    src/haibox/images/scan.py rejects the unsupported Trivy report and falls
    back to Grype, which covers Fedora OS packages.
direct_packages:
  - xpra-6.5.4-1.fc44
  - xterm-411-1.fc44
  - xorg-x11-server-Xvfb-21.1.25-2.fc44
  - socat-1.8.1.3-1.fc44
  - python3-gobject-3.56.3-1.fc44.x86_64
package_inventory:
  lockfile: packages.lock
  packages: 502
  sha256: 5c87a0908d77144f8beff935097e220814f8d1802ba9bad658bac277642afe06
runtime:
  user: 1000:1000
  workspace: /workspace
  entrypoint: /bin/bash
  labels:
    haibox.poc: xpra-seamless
    haibox.production: "false"
session:
  display: ":100"
  bind: 127.0.0.1:14500
  auth: file
  disabled:
    - clipboard
    - file-transfer
    - printing
    - speaker
    - microphone
    - webcam
    - notifications
    - system-tray
    - dbus
    - start-new-commands
    - sharing
    - html
    - mdns
  start_command: xterm
verification:
  build: reproducible while the Fedora 44 repositories retain the pinned NEVRAs
  inventory: record packages.lock from the built image
  scan: >-
    Use the hardened image scanner; the first pass must show Trivy as
    unsupported and Grype as the covering tool. Record HIGH/CRITICAL counts
    without suppression.
