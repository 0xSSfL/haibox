[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "haibox"
version = "0.1.0"
description = "An isolation-first, manual-first penetration testing platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HAIBOX contributors" }]
keywords = ["security", "pentest", "docker", "isolation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<16",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0,<7",
]
docs = [
  "mkdocs-material>=9,<10",
]

[project.urls]
Homepage = "https://0xssfl.github.io/haibox/"
Documentation = "https://0xssfl.github.io/haibox/"
Repository = "https://github.com/0xSSfL/haibox"

[project.scripts]
haibox = "haibox.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/haibox"]

[tool.hatch.build.targets.wheel.force-include]
"images" = "haibox/data/images"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/images",
  "/profiles",
  "/docs",
  "/tests",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: requires a dedicated Docker context and is skipped by default",
]
