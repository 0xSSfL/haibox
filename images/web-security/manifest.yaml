api_version: haibox/v1
name: web-security
version: 0.1.0
# The tool versions below are the upstream releases. The Go tools are built
# from the source of those releases with the patched requirement sets in
# gomod/, and the build checks the resulting module metadata against
# module-requirements.txt and forbidden-modules.txt.
status: active
description: Web application testing image with pinned Go and Python tooling.
base: debian:13-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
dockerfile: Dockerfile
context: .
platforms:
  - linux/amd64
build_args:
  DEBIAN_SNAPSHOT: "20261108T000000Z"
  NUCLEI_TEMPLATES_COMMIT: "79fb682760ab3d5b0e22afbb44709353cbebf023"
tools:
  - name: ffuf
    version: v2.3.0
    verify: ffuf -V
  - name: gobuster
    version: v3.8.2
    verify: gobuster --version
  - name: nuclei
    version: v3.11.1
    verify: nuclei -version
  - name: httpx
    version: v1.12.0
    verify: httpx -version
  - name: subfinder
    version: v2.17.0
    verify: subfinder -version
  - name: katana
    version: v1.8.0
    verify: katana -version
  - name: dalfox
    version: v2.13.0
    verify: dalfox --help
  - name: arjun
    version: 2.2.7
    verify: arjun --help
  - name: dirsearch
    version: 0.5.0
    verify: dirsearch --help
  - name: sqlmap
    version: 1.10.11
    verify: sqlmap --version
  - name: nikto
    version: debian-trixie-20261108
    verify: nikto -Version
  - name: whatweb
    version: debian-trixie-20261108
    verify: whatweb --version
  - name: dirb
    version: debian-trixie-20261108
    verify: test -x /usr/bin/dirb
  - name: nmap
    version: debian-trixie-20261108
    verify: nmap --version
  - name: nuclei-templates
    version: 79fb682760ab3d5b0e22afbb44709353cbebf023
    verify: test -d /opt/nuclei-templates
