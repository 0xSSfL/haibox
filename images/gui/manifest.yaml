api_version: haibox/v1
name: gui
version: 0.1.0
status: experimental
description: Optional Xpra seamless server for a GUI session inside an existing engagement runner.
base: fedora:46@sha256:78bb31de333664aa76c4bf54306791cd294c0bd4fbcfc4346e2286261de544c4
dockerfile: Dockerfile
context: .
platforms:
  - linux/amd64
tools:
  - name: xpra
    version: 6.5.6-1.fc46
    verify: xpra --version
  - name: xterm
    version: 411-1.fc46
    verify: xterm -version
  - name: xorg-x11-server-Xvfb
    version: 21.1.26-1.fc46
    verify: Xvfb -help
  - name: socat
    version: 1.8.1.3-1.fc46
    verify: socat -V
